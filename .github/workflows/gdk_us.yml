name: GDK 美股启动选股

on:
  repository_dispatch:
    types: [gdk-us-scan]
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: 运行GDK美股扫描
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python report_gdk_us.py
